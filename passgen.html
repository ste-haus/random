<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Password &amp; Text Generator</title>
    <style>
        :root {
            --bg-page: #121212;
            --bg-card: #1e1e1e;
            --bg-field: #2a2a2a;
            --bg-field-hover: #363636;
            --text-primary: #e0e0e0;
            --text-heading: #f0f0f0;
            --text-muted: #b0b0b0;
            --border: #444;
            --accent: #2196F3;
            --accent-hover: #1976D2;
            --pulse: #9C27B0;
            --pulse-shadow: rgba(156, 39, 176, 0.6);
            --pulse-shadow-fade: rgba(156, 39, 176, 0);
        }

        body {
            background: var(--bg-page);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .cards {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
        }

        .container {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 360px;
            max-width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        h2 {
            text-align: center;
            color: var(--text-heading);
        }

        label {
            display: flex;
            align-items: center;
            font-weight: 500;
            margin-top: 12px;
            color: var(--text-muted);
        }

        input[type="number"], input[type="text"] {
            margin-top: 8px;
            padding: 10px;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: var(--bg-field);
            color: var(--text-primary);
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            accent-color: var(--accent);
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .length-control input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }

        .length-control input[type="number"] {
            width: 72px;
            margin: 0;
            text-align: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            background-color: var(--bg-field);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            justify-content: space-between;
        }

        .checkbox-label:hover {
            background-color: var(--bg-field-hover);
        }

        .info-button {
            background-color: var(--border);
            color: var(--text-primary);
            border: none;
            padding: 3px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-left: 10px;
            width: 18px;
            height: 18px;
            text-align: center;
            line-height: 12px;
        }

        .checkbox-label span {
            font-size: 16px;
            color: var(--text-primary);
        }

        .drawer {
            margin-top: 12px;
        }

        .drawer > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: var(--bg-field);
            border-radius: 8px;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            list-style: none;
            transition: background-color 0.3s ease;
        }

        .drawer > summary::-webkit-details-marker {
            display: none;
        }

        .drawer > summary::after {
            content: '\25B8';
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .drawer[open] > summary {
            margin-bottom: 12px;
        }

        .drawer[open] > summary::after {
            transform: rotate(90deg);
        }

        .drawer .drawer-last {
            margin-bottom: 0;
        }

        button {
            background-color: var(--accent);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 12px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .button-row button {
            flex: 1 1 90px;
            width: auto;
            margin-top: 0;
        }

        .collapsible {
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.35s ease,
                        margin-top 0.35s ease, padding 0.35s ease;
        }

        .collapsible.show {
            max-height: 500px;
            margin-top: 20px;
            opacity: 1;
            overflow-y: auto;
        }

        .output-box {
            padding: 0 12px;
            background-color: var(--bg-field);
            border-radius: 8px;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            word-break: break-all;
            cursor: pointer;
        }

        .output-box.show {
            padding: 12px;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0;
        }

        .password-option {
            background-color: var(--bg-field);
            border-radius: 8px;
            padding: 14px 12px;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            word-break: break-all;
            cursor: pointer;
        }

        .tooltip {
            display: none;
            position: absolute;
            background-color: #333;
            color: #fff;
            padding: 5px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
        }

        .info-button:hover + .tooltip {
            display: inline-block;
        }

        @keyframes pulse-purple-button {
            0%   { background-color: var(--pulse); box-shadow: 0 0 0 0 var(--pulse-shadow); }
            100% { background-color: var(--accent); box-shadow: 0 0 0 12px var(--pulse-shadow-fade); }
        }

        button.pulse {
            animation: pulse-purple-button 0.6s ease-out;
        }

        @keyframes pulse-purple-box {
            0%   { background-color: var(--pulse); box-shadow: 0 0 0 0 var(--pulse-shadow); }
            100% { background-color: var(--bg-field); box-shadow: 0 0 0 12px var(--pulse-shadow-fade); }
        }

        .output-box.pulse, .password-option.pulse {
            animation: pulse-purple-box 0.6s ease-out;
        }
    </style>
</head>
<body>

    <div class="cards">
        <div class="container">
            <h2>Password</h2>
            <form id="password-form">
                <label for="length">Password Length</label>
                <div class="length-control">
                    <input type="range" id="password-length-slider" min="4" max="64" value="24">
                    <input type="number" id="length" min="4" max="64" value="24">
                </div>

                <div class="button-row">
                    <button type="button" onclick="generatePassword()">Select</button>
                    <button type="button" id="clipboard-button" onclick="generateToClipboard()">Clipboard</button>
                </div>

                <details class="drawer">
                    <summary>Options</summary>

                    <label class="checkbox-label" for="include-upper">
                        <input type="checkbox" id="include-upper" checked>
                        <span>Include Uppercase Letters</span>
                        <button type="button" class="info-button">i</button>
                        <div class="tooltip">A-Z</div>
                    </label>

                    <label class="checkbox-label" for="include-numbers">
                        <input type="checkbox" id="include-numbers" checked>
                        <span>Include Numbers</span>
                        <button type="button" class="info-button">i</button>
                        <div class="tooltip">0-9</div>
                    </label>

                    <label class="checkbox-label" for="include-specials">
                        <input type="checkbox" id="include-specials">
                        <span>Include Special Characters</span>
                        <button type="button" class="info-button">i</button>
                        <div class="tooltip">!@#$%^&*()_+~`|}{[]:;?><,./-=</div>
                    </label>

                    <label class="checkbox-label" for="exclude-similar">
                        <input type="checkbox" id="exclude-similar">
                        <span>Exclude Similar Characters</span>
                        <button type="button" class="info-button">i</button>
                        <div class="tooltip">I, l, 1, O, 0</div>
                    </label>

                    <label class="checkbox-label" for="exclude-vowels">
                        <input type="checkbox" id="exclude-vowels">
                        <span>Exclude Vowels</span>
                        <button type="button" class="info-button">i</button>
                        <div class="tooltip">a, e, i, o, u</div>
                    </label>

                    <label class="checkbox-label drawer-last" for="exclude-ambiguous">
                        <input type="checkbox" id="exclude-ambiguous">
                        <span>Avoid Ambiguous Characters</span>
                        <button type="button" class="info-button">i</button>
                        <div class="tooltip">{ } [ ] ( ) / \ ' " ~ , ; : . < ></div>
                    </label>
                </details>
            </form>

            <div id="password-output" class="collapsible option-list"></div>
        </div>

        <div class="container">
            <h2>Text</h2>
            <form id="text-form">
                <label for="text-length">Length</label>
                <div class="length-control">
                    <input type="range" id="text-length-slider" min="1" max="128" value="32">
                    <input type="number" id="text-length" min="1" max="128" value="32">
                </div>

                <div class="button-row">
                    <button type="button" onclick="generateText('base64')">Base64</button>
                    <button type="button" onclick="generateText('bytes')">Bytes</button>
                    <button type="button" onclick="generateText('hex')">Hex</button>
                    <button type="button" onclick="generateText('uuid')">UUID</button>
                    <button type="button" onclick="generateText('mac')">MAC</button>
                </div>
            </form>

            <div id="text-output" class="collapsible output-box" title="Click to copy" onclick="copyToClipboard('text-output')"></div>
        </div>
    </div>

    <script>
        const FORMAT_BASE64 = 'base64';
        const FORMAT_BYTES = 'bytes';
        const FORMAT_HEX = 'hex';
        const FORMAT_UUID = 'uuid';
        const FORMAT_MAC = 'mac';

        const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
        const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const DIGITS = '0123456789';
        const SPECIALS = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

        const PASSWORD_OPTION_COUNT = 5;
        const MAC_BYTE_COUNT = 6;
        const HEX_CHARS_PER_BYTE = 2;
        const BASE64_BYTES_PER_CHAR = 3 / 4;
        const BASE64_BYTE_SLACK = 3;

        function buildPassword() {
            const length = document.getElementById('length').value;
            const includeUpper = document.getElementById('include-upper').checked;
            const includeNumbers = document.getElementById('include-numbers').checked;
            const includeSpecials = document.getElementById('include-specials').checked;
            const excludeSimilar = document.getElementById('exclude-similar').checked;
            const excludeVowels = document.getElementById('exclude-vowels').checked;
            const excludeAmbiguous = document.getElementById('exclude-ambiguous').checked;

            let characterSet = LOWERCASE;
            if (includeUpper) characterSet += UPPERCASE;
            if (includeNumbers) characterSet += DIGITS;
            if (includeSpecials) characterSet += SPECIALS;

            // Exclude similar characters
            if (excludeSimilar) {
                characterSet = characterSet.replace(/[Il1O0]/g, '');
            }

            // Exclude vowels
            if (excludeVowels) {
                characterSet = characterSet.replace(/[aeiouAEIOU]/g, '');
            }

            // Exclude ambiguous characters
            if (excludeAmbiguous) {
                characterSet = characterSet.replace(/[{}[\]()\/\\'"\~`,;:.<>]/g, '');
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * characterSet.length);
                password += characterSet[randomIndex];
            }

            return password;
        }

        // Generate a list of password options; clicking one copies just that option.
        function generatePassword() {
            const output = document.getElementById('password-output');
            output.innerHTML = '';

            for (let i = 0; i < PASSWORD_OPTION_COUNT; i++) {
                const option = document.createElement('div');
                option.className = 'password-option';
                option.textContent = buildPassword();
                option.title = 'Click to copy';
                option.addEventListener('click', () => {
                    navigator.clipboard.writeText(option.textContent);
                    pulse(option);
                });
                output.appendChild(option);
            }

            output.classList.add('show');
        }

        // Generate a fresh password straight to the clipboard, keeping the list hidden.
        function generateToClipboard() {
            const output = document.getElementById('password-output');
            output.classList.remove('show');
            output.innerHTML = '';
            navigator.clipboard.writeText(buildPassword());
            pulse(document.getElementById('clipboard-button'));
        }

        function randomBytes(count) {
            const bytes = new Uint8Array(count);
            crypto.getRandomValues(bytes);
            return bytes;
        }

        function toHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateText(format) {
            let result;

            if (format === FORMAT_UUID) {
                result = crypto.randomUUID();
            } else if (format === FORMAT_MAC) {
                const bytes = randomBytes(MAC_BYTE_COUNT);
                result = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(':');
            } else {
                const length = parseInt(document.getElementById('text-length').value, 10) || 1;

                if (format === FORMAT_HEX) {
                    const byteCount = Math.ceil(length / HEX_CHARS_PER_BYTE);
                    result = toHex(randomBytes(byteCount)).slice(0, length);
                } else if (format === FORMAT_BASE64) {
                    const byteCount = Math.ceil(length * BASE64_BYTES_PER_CHAR) + BASE64_BYTE_SLACK;
                    let binary = '';
                    randomBytes(byteCount).forEach(b => binary += String.fromCharCode(b));
                    result = btoa(binary).replace(/=+$/, '').slice(0, length);
                } else {
                    result = Array.from(randomBytes(length)).join(' ');
                }
            }

            const output = document.getElementById('text-output');
            output.textContent = result;
            output.classList.add('show');
        }

        function copyToClipboard(outputId) {
            const output = document.getElementById(outputId);
            navigator.clipboard.writeText(output.textContent);
            pulse(output);
        }

        function pulse(element) {
            element.classList.remove('pulse');
            // Force reflow so the animation restarts on rapid successive clicks
            void element.offsetWidth;
            element.classList.add('pulse');
        }

        // Keep each length slider and its number box in sync.
        function bindLengthControl(sliderId, numberId) {
            const slider = document.getElementById(sliderId);
            const number = document.getElementById(numberId);

            slider.addEventListener('input', () => {
                number.value = slider.value;
            });

            number.addEventListener('input', () => {
                const min = parseInt(number.min, 10);
                const max = parseInt(number.max, 10);
                let value = parseInt(number.value, 10);
                if (isNaN(value)) return;
                if (value < min) value = min;
                if (value > max) value = max;
                slider.value = value;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            bindLengthControl('password-length-slider', 'length');
            bindLengthControl('text-length-slider', 'text-length');
        });
    </script>
</body>
</html>
